<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Download DreamScapes for iPhone, iPad and Android. Personalised children's bedtime stories, read aloud in a voice you choose. The first story is free."
    />
    <meta name="theme-color" content="#16184a" />
    <title>Download DreamScapes</title>

    <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png?v=2026100885" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png?v=2026100885" />

    <!-- The app's own two faces: Baloo for the brand, Nunito for the reading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Shared when the link is pasted into a message or a profile. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DreamScapes, personalised bedtime stories" />
    <meta
      property="og:description"
      content="A story written for your child tonight, read aloud in a voice you choose. The first one is free."
    />
    <meta property="og:url" content="https://www.dreamscapes.cloud/download" />
    <meta property="og:image" content="https://www.dreamscapes.cloud/assets/link-preview.jpg?v=2026101501" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DreamScapes - a parent and child reading a glowing storybook at bedtime" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Self-contained on purpose. styles.css is ~9,700 lines written for the
         app itself; a page with a logo and two buttons should not wait on it,
         and the palette and type below are taken from it so the two still look
         like the same product. -->
    <style>
      :root {
        --night: #10143c;
        --night-deep: #0a0e2c;
        --gold: #ffd96a;
        --white: #fffefe;
        --soft: rgba(226, 231, 255, 0.78);
        --line: rgba(132, 148, 255, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        /* The same night sky the app opens on. */
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
        background:
          radial-gradient(1100px 620px at 50% -10%, rgba(124, 142, 255, 0.26), transparent 70%),
          linear-gradient(176deg, #1b2160 0%, var(--night) 52%, var(--night-deep) 100%);
        background-attachment: fixed;
        color: var(--white);
        font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }

      main {
        width: min(460px, 100%);
        display: grid;
        gap: 26px;
        justify-items: center;
      }

      /* The hidden attribute is how this page shows and hides things, and the
         browser's own [hidden] rule is the weakest there is - any display here
         beats it, which is how .badge{display:inline-flex} kept a badge on
         screen after the script hid it. */
      [hidden] {
        display: none !important;
      }

      .home {
        display: block;
        line-height: 0;
      }

      .logo {
        width: min(300px, 76%);
        height: auto;
      }

      h1 {
        margin: 0;
        font-family: "Baloo 2", "Nunito", sans-serif;
        font-size: clamp(1.7rem, 7vw, 2.3rem);
        font-weight: 700;
        line-height: 1.18;
      }

      h1 span {
        display: block;
        color: var(--gold);
      }

      p.lead {
        margin: 0;
        max-width: 34ch;
        color: var(--soft);
        font-size: 1.04rem;
        font-weight: 600;
        line-height: 1.5;
      }

      .stores {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }

      /* Both badges are used as supplied and only scaled. Apple's SVG is the
         badge itself; Google's PNG carries its own mandated clear space, 41px
         of padding around a 564x168 badge - two thirds of the canvas - so
         rendering them at the same height would leave Google's looking a
         third smaller. Google's is set taller by exactly that ratio, which
         lands both visible badges on the same 52px. */
      .badge {
        display: inline-flex;
        border-radius: 10px;
        transition: transform 0.18s ease, opacity 0.18s ease;
      }

      .badge img {
        display: block;
        height: auto;
      }

      .badge-apple img {
        height: 52px;
      }

      .badge-google img {
        height: 77px;
        /* Cancels the clear space so the two sit on the same baseline. */
        margin: -12px 0;
      }

      .badge:hover,
      .badge:focus-visible {
        opacity: 0.88;
        outline: none;
      }

      .badge:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 4px;
      }

      .badge:active {
        transform: scale(0.98);
      }

      .free {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-radius: 999px;
        background: linear-gradient(104deg, #ffd978 0%, #ffbf63 100%);
        color: #3a2708;
        font-size: 0.9rem;
        font-weight: 900;
      }

      /* Only shown to the browsers that need it - see the script below. */
      .inapp-note {
        margin: -6px 0 0;
        max-width: 36ch;
        padding: 12px 16px;
        border: 1.5px solid rgba(255, 212, 92, 0.42);
        border-radius: 16px;
        background: rgba(255, 212, 92, 0.1);
        color: rgba(255, 240, 200, 0.92);
        font-size: 0.92rem;
        font-weight: 700;
        line-height: 1.45;
      }

      .copy-link {
        display: block;
        margin: 12px auto 0;
        padding: 10px 18px;
        border: 1.5px solid rgba(255, 212, 92, 0.6);
        border-radius: 999px;
        background: rgba(255, 212, 92, 0.16);
        color: var(--gold);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      .copy-link:active {
        transform: scale(0.98);
      }

      .inapp-note strong {
        color: var(--gold);
        font-weight: 900;
      }

      /* The badge for the other kind of phone, once the page knows which one
         you are holding. Quiet on purpose: it is for the person buying for
         somebody else, not the decision this page is asking for. */
      .other-store {
        margin: -8px 0 0;
      }

      .other-store a {
        color: rgba(185, 196, 255, 0.78);
        font-size: 0.92rem;
        font-weight: 700;
        text-decoration: none;
        border-bottom: 1px solid rgba(185, 196, 255, 0.3);
      }

      .other-store a:hover,
      .other-store a:focus-visible {
        color: var(--white);
        outline: none;
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: rgba(185, 196, 255, 0.64);
        font-size: 0.86rem;
        font-weight: 700;
      }

      footer a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(185, 196, 255, 0.28);
      }

      footer a:hover,
      footer a:focus-visible {
        color: var(--white);
        outline: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .store {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The logo is the way to the web app, so the footer does not need a
           link for it. A logo going home is a convention people already
           know, and it costs the page nothing. -->
      <a class="home" href="https://www.dreamscapes.cloud/">
        <img
          class="logo"
          src="./assets/dreamscapes-logo.png?v=2026101501"
          alt="DreamScapes"
          width="900"
          height="394"
        />
      </a>

      <h1>A bedtime story<span>made just for them</span></h1>

      <p class="lead">
        Their name, their favourite things, and a storyteller you choose. Read
        aloud at lights-out, or together on the page.
      </p>

      <span class="free">★ The first story is free</span>

      <p class="inapp-note" id="inapp-note" hidden>
        TikTok's browser cannot open the App Store.
        <button class="copy-link" id="copy-link" type="button">Copy link</button>
      </p>

      <div class="stores">
        <!-- Apple's and Google's own artwork, unaltered, as both brand
             guidelines require. Straight to the stores rather than through
             /app: that one guesses from the user agent, which is right for a
             link in a profile, but someone on a laptop wants to see both.

             No mt=8 on the Apple link. It is a legacy hint that pushes the
             link at the App Store application rather than the web listing,
             and on a Mac that application cannot show an iPhone-only app - it
             answers "the action cannot be completed". Without it the listing
             opens as a web page, which is what a desktop visitor can
             actually use. ct=download stays, so the campaign still counts. -->
        <a
          class="badge badge-apple"
          href="https://apps.apple.com/app/id6784545562?ct=download"
          aria-label="Download DreamScapes on the App Store"
        >
          <img src="./assets/badges/app-store-badge.svg?v=2026101501" alt="Download on the App Store" />
        </a>

        <a
          class="badge badge-google"
          href="https://play.google.com/store/apps/details?id=cloud.dreamscapes.app&amp;referrer=utm_source%3Ddownload%26utm_medium%3Dweb"
          aria-label="Get DreamScapes on Google Play"
        >
          <img src="./assets/badges/google-play-badge.png?v=2026101501" alt="Get it on Google Play" />
        </a>
      </div>

      <p class="other-store" id="other-store" hidden>
        <a id="other-store-link" href="#">Also on Google Play</a>
      </p>

      <footer>
        <a href="https://www.dreamscapes.cloud/support.html">Support</a>
        <span aria-hidden="true">·</span>
        <a href="https://www.dreamscapes.cloud/support.html#privacy">Privacy</a>
      </footer>
    </main>

    <script>
      /* Two buttons is a choice nobody on a phone needs to make: iOS cannot
         install from Play and Android cannot install from the App Store. So
         the page shows the one that applies and keeps the other as a quiet
         line underneath, for the parent buying for somebody else's phone.

         Both badges are in the markup and this hides one, rather than the
         other way round - with no JavaScript, or on a device nobody
         anticipated, you still get both and the page still works. */
      (function () {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        if (!isIOS && !isAndroid) return;

        var apple = document.querySelector(".badge-apple");
        var google = document.querySelector(".badge-google");
        var other = document.getElementById("other-store");
        var otherLink = document.getElementById("other-store-link");
        if (!apple || !google || !other || !otherLink) return;

        var spare = isIOS ? google : apple;
        spare.hidden = true;
        otherLink.href = spare.getAttribute("href");
        otherLink.textContent = isIOS ? "Also on Google Play" : "Also on the App Store";
        other.hidden = false;
      })();

      /* An App Store link has to hand off to a native app. The browsers inside
         TikTok, Instagram and Facebook often refuse that on iOS, and the
         visitor gets "the action cannot be completed" - which is why the Play
         link works from the same post and this one does not: Android treats it
         as an ordinary URL and never needs the handoff.
         Nothing here can force the handoff, so the page says what to do
         instead, and only to the people it affects. */
      (function () {
        var ua = navigator.userAgent || "";
        var inApp = /musical_ly|Bytedance|TikTok|Instagram|FBAN|FBAV|Line\/|Snapchat/i.test(ua);
        var ios = /iPhone|iPad|iPod/i.test(ua);
        if (!inApp || !ios) return;

        var note = document.getElementById("inapp-note");
        if (note) note.hidden = false;

        /* Finding the ... menu is a lot to ask of someone who just wanted the
           app. Copying the link lets them paste it into Safari instead, which
           is the one route out of here that always works. */
        /* One attempt at getting round it before falling back to the note.
           The https link is a universal link, and that is the thing these
           browsers refuse: it asks iOS to leave the webview for a native app.
           itms-apps:// is a plain custom scheme, a different mechanism, and
           some of them pass it through.

           If it is also blocked the tap does nothing at all, which is worse
           than an error, so the https link follows a beat later. When the
           scheme does work the page is hidden by then - the App Store is in
           front of it - and the fallback is cancelled. */
        var apple = document.querySelector(".badge-apple");
        if (apple) {
          apple.addEventListener("click", function (event) {
            event.preventDefault();
            var web = apple.getAttribute("href");
            var left = false;
            var onHide = function () {
              if (document.hidden) left = true;
            };
            document.addEventListener("visibilitychange", onHide);
            window.location.href = "itms-apps://apps.apple.com/app/id6784545562?ct=download";
            window.setTimeout(function () {
              document.removeEventListener("visibilitychange", onHide);
              if (!left && !document.hidden) window.location.href = web;
            }, 900);
          });
        }

        var button = document.getElementById("copy-link");
        var link = "https://www.dreamscapes.cloud/download";
        if (!button) return;
        button.addEventListener("click", function () {
          var done = function () {
            button.textContent = "Copied. Now paste it into Safari";
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(done, fallback);
          } else {
            fallback();
          }
          function fallback() {
            // Older in-app webviews have no clipboard API; this one is ancient
            // enough to work in all of them.
            var field = document.createElement("textarea");
            field.value = link;
            field.setAttribute("readonly", "");
            field.style.position = "fixed";
            field.style.opacity = "0";
            document.body.appendChild(field);
            field.select();
            try {
              document.execCommand("copy");
              done();
            } catch (error) {
              button.textContent = link;
            }
            document.body.removeChild(field);
          }
        });
      })();
    </script>
  </body>
</html>
