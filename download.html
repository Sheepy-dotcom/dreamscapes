<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Download DreamScapes for iPhone, iPad and Android. Personalised children's bedtime stories, read aloud in a voice you choose. The first story is free."
    />
    <meta name="theme-color" content="#16184a" />
    <title>Download DreamScapes</title>

    <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png?v=2026100885" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png?v=2026100885" />

    <!-- The app's own two faces: Baloo for the brand, Nunito for the reading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Shared when the link is pasted into a message or a profile. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DreamScapes, personalised bedtime stories" />
    <meta
      property="og:description"
      content="A story written for your child tonight, read aloud in a voice you choose. The first one is free."
    />
    <meta property="og:url" content="https://www.dreamscapes.cloud/download" />
    <meta property="og:image" content="https://www.dreamscapes.cloud/assets/link-preview.jpg?v=2026101501" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DreamScapes - a parent and child reading a glowing storybook at bedtime" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Self-contained on purpose. styles.css is ~9,700 lines written for the
         app itself; a page with a logo and two buttons should not wait on it,
         and the palette and type below are taken from it so the two still look
         like the same product. -->
    <style>
      :root {
        --night: #10143c;
        --night-deep: #0a0e2c;
        --gold: #ffd96a;
        --white: #fffefe;
        --soft: rgba(226, 231, 255, 0.78);
        --line: rgba(132, 148, 255, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        /* The same night sky the app opens on. */
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
        background:
          radial-gradient(1100px 620px at 50% -10%, rgba(124, 142, 255, 0.26), transparent 70%),
          linear-gradient(176deg, #1b2160 0%, var(--night) 52%, var(--night-deep) 100%);
        background-attachment: fixed;
        color: var(--white);
        font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }

      main {
        width: min(460px, 100%);
        display: grid;
        gap: 26px;
        justify-items: center;
      }

      /* The hidden attribute is how this page shows and hides things, and the
         browser's own [hidden] rule is the weakest there is - any display here
         beats it, which is how .badge{display:inline-flex} kept a badge on
         screen after the script hid it. */
      [hidden] {
        display: none !important;
      }

      /* The hero: artwork with the lockup and the line laid over it. A scrim
         only across the top, because the words sit there and the picture has a
         dragon and a balloon in that corner; the rest of the frame is left
         alone. */
      /* The picture is the page. Full bleed behind everything, with a scrim
         over the top for the lockup and a heavier one up from the foot for the
         button and the badges - the artwork is lit and busy in both places, so
         the words need ground under them.

         Sized by cover against the screen rather than by the file's own
         proportions: the frame is 1:1.5 and a phone is nearer 1:2.16, so a
         little is lost from the sides, and the child sits close enough to the
         middle to survive it. */
      /* The page is the picture and then a block beneath it, rather than the
         picture behind everything. #171024 is sampled from the artwork's own
         bottom edge, so the join is invisible and the links sit on their own
         ground instead of on top of the scene. */
      body {
        display: block;
        padding: 0;
        background: linear-gradient(180deg, #171024 0%, #171024 42%, #0e0918 100%);
      }

      main {
        width: 100%;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        padding: 0;
      }

      .art {
        position: relative;
        width: 100%;
      }

      /* The picture dissolves into the block rather than meeting it on a line.
         Sampling the file's bottom edge was not enough on its own: object-fit
         crops, so the row actually on show at the foot changes with the shape
         of the screen. A fade works whatever is there. */
      .art::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 92px;
        background: linear-gradient(180deg, rgba(23, 16, 36, 0) 0%, #171024 86%, #171024 100%);
      }

      .art-img {
        display: block;
        width: 100%;
        /* The picture takes whatever is left once the links have their room,
           rather than a share of the screen that happens to fit a tall phone.
           288 points is what the button, the rule, the badges and the footer
           need; below that the fraction would push them off a short screen,
           above it the picture would be smaller than it needs to be. */
        max-height: min(64vh, calc(100svh - 288px));
        height: auto;
        object-fit: cover;
        object-position: center 34%;
      }

      /* Over the top of the picture, where the sky is. A scrim because the
         artwork has a dragon and a balloon in that corner. */
      .top {
        position: absolute;
        inset: 0 0 auto;
        display: grid;
        justify-items: center;
        gap: 8px;
        padding: calc(22px + env(safe-area-inset-top)) 20px 46px;
        background: linear-gradient(
          180deg,
          rgba(8, 11, 38, 0.86) 0%,
          rgba(8, 11, 38, 0.5) 46%,
          rgba(8, 11, 38, 0) 100%
        );
      }

      /* Everything a visitor can act on, on the plain block below the picture
         where nothing has to compete with the artwork. */
      .actions {
        flex: 1;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 16px;
        width: min(420px, 100%);
        margin: 0 auto;
        padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
      }

      .home {
        display: block;
        line-height: 0;
      }

      .logo {
        width: min(210px, 56%);
        height: auto;
      }

      h1 {
        margin: 0;
        font-family: "Baloo 2", "Nunito", sans-serif;
        font-size: clamp(1.6rem, 6.4vw, 2.1rem);
        line-height: 1.15;
        text-shadow: 0 2px 18px rgba(6, 9, 34, 0.7);
      }

      h1 span {
        display: block;
        color: var(--gold);
      }

      .cta {
        display: block;
        width: 100%;
        border-radius: 999px;
        padding: 15px 22px;
        background: linear-gradient(135deg, #ffd45c, #ffb02e);
        color: #3b2500;
        text-decoration: none;
        box-shadow: 0 16px 36px rgba(255, 176, 46, 0.26);
      }

      .cta strong {
        display: block;
        font-size: 1.1rem;
        font-weight: 800;
      }

      .cta small {
        display: block;
        margin-top: 2px;
        font-size: 0.84rem;
        font-weight: 700;
        opacity: 0.74;
      }

      .cta:active {
        transform: scale(0.99);
      }

      /* A rule with the words sitting in it, so the badges below read as the
         second option rather than a competing first one. */
      .or {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin: 0;
        color: rgba(214, 205, 255, 0.6);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .or::before,
      .or::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(185, 196, 255, 0.2);
      }

      /* Side by side, not stacked. Stacking cost about seventy points of
         height and all of it came out of the picture, which is the reason
         anyone looks at this page twice. They wrap back to a column if the
         screen is too narrow to hold both. */
      .stores {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
      }

      .badge {
        display: inline-flex;
        border-radius: 10px;
        transition: transform 0.18s ease, opacity 0.18s ease;
      }

      .badge:hover {
        transform: translateY(-2px);
      }

      .badge img {
        display: block;
        height: 46px;
        width: auto;
      }

      /* Google's artwork carries its own clear space inside the file, so at a
         matching height it reads noticeably smaller than Apple's. Scaled up to
         sit level with it; neither file is altered. */
      .badge-google img {
        height: 53px;
      }

      /* The Apple badge becomes a <button> on iOS, so it has to shed the
         browser's own button styling and match the anchor beside it exactly. */
      button.badge {
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
      }

      .inapp-note {
        margin: -6px 0 0;
        max-width: 36ch;
        padding: 12px 16px;
        border: 1.5px solid rgba(255, 212, 92, 0.42);
        border-radius: 16px;
        background: rgba(255, 212, 92, 0.1);
        color: rgba(255, 240, 200, 0.92);
        font-size: 0.92rem;
        font-weight: 700;
        line-height: 1.45;
      }

      .copy-link {
        display: block;
        margin: 12px auto 0;
        padding: 10px 18px;
        border: 1.5px solid rgba(255, 212, 92, 0.6);
        border-radius: 999px;
        background: rgba(255, 212, 92, 0.16);
        color: var(--gold);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      .copy-link:active {
        transform: scale(0.98);
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: rgba(185, 196, 255, 0.64);
        font-size: 0.86rem;
        font-weight: 700;
      }

      footer a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(185, 196, 255, 0.28);
      }

      footer a:hover,
      footer a:focus-visible {
        color: var(--white);
        outline: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .store {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="art">
        <img
          class="art-img"
          src="./assets/web-only/download-hero.webp?v=2026101706"
          alt="A child reading in bed while a dragon, a hot-air balloon, a lighthouse and a whale rise out of the storybook"
          width="768"
          height="1152"
          loading="eager"
        />
        <header class="top">
        <!-- A logo going home is a convention people already know, so the
             footer does not need a link for it. -->
        <a class="home" href="https://www.dreamscapes.cloud/">
          <img
            class="logo"
            src="./assets/dreamscapes-logo.png?v=2026101501"
            alt="DreamScapes"
            width="900"
            height="394"
          />
        </a>
        <h1>A bedtime story<span>made just for them</span></h1>
        </header>
      </div>

      <div class="actions">
        <!-- The one action that works for everybody, on every browser. The
             store badges below need a hand-off iOS will not perform inside
             TikTok, and a laptop cannot install an iPhone app at all; this
             needs neither. -->
        <a class="cta" href="https://www.dreamscapes.cloud/">
          <strong>Start a free story</strong>
          <small>No install, no account</small>
        </a>

        <p class="inapp-note" id="inapp-note" hidden>
          This browser will not open the App Store. Copy the link and paste it
          into Safari.
          <button class="copy-link" id="copy-link" type="button">Copy link</button>
        </p>

        <p class="or"><span>or get the app</span></p>

        <div class="stores">
          <!-- Apple's and Google's own artwork, unaltered, as both brand
               guidelines require. Straight to the stores rather than through
               /app: that one guesses from the user agent, which is right for a
               link in a profile, but someone on a laptop wants to see both.

               No mt=8 on the Apple link. It is a legacy hint that pushes the
               link at the App Store application rather than the web listing,
               and on a Mac that application cannot show an iPhone-only app -
               it answers "the action cannot be completed". Without it the
               listing opens as a web page, which is what a desktop visitor can
               actually use. ct=download stays, so the campaign still counts. -->
          <a
            class="badge badge-apple"
            href="https://apps.apple.com/app/id6784545562?ct=download"
            aria-label="Download DreamScapes on the App Store"
          >
            <img src="./assets/badges/app-store-badge.svg?v=2026101501" alt="Download on the App Store" />
          </a>

          <a
            class="badge badge-google"
            href="https://play.google.com/store/apps/details?id=cloud.dreamscapes.app&amp;referrer=utm_source%3Ddownload%26utm_medium%3Dweb"
            aria-label="Get DreamScapes on Google Play"
          >
            <img src="./assets/badges/google-play-badge.png?v=2026101501" alt="Get it on Google Play" />
          </a>
        </div>

        <footer>
          <a href="https://www.dreamscapes.cloud/support.html">Support</a>
          <span aria-hidden="true">·</span>
          <a href="https://www.dreamscapes.cloud/support.html#privacy">Privacy</a>
        </footer>
      </div>
    </main>

    <script>
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || "");

      (function () {
        /* Why the App Store link fails inside TikTok, and what actually fixes
           it.

           Ask apps.apple.com for this app with an iPhone user agent and it
           does not serve a page. It answers:

               301  Location: itms-appss://apps.apple.com/app/id6784545562

           - a custom scheme. Safari follows it and the App Store opens. An
           in-app webview is handed a scheme it will not follow, and that is
           exactly the "action cannot be completed" people were getting. It
           also means an https link is useless as a fallback, because it leads
           straight back to the same redirect.

           So on iOS the button carries that scheme directly instead of being
           redirected into it. A plain anchor, no tap handler in the way: a
           webview decides about a custom scheme on its own, and handing it one
           is the best chance of it passing the tap to the App Store.

           The markup keeps the https link, which is right for desktop and for
           anyone without JavaScript. */
        if (!isIOS) return;
        var apple = document.querySelector(".badge-apple");
        if (!apple) return;

        /* The link test that worked used a <button>, and the badge is an <a>.
           That difference is the whole bug.

           Preventing the anchor's default was not enough: this in-app browser
           takes the tap at the anchor itself and hands it to its own tab
           logic, which cannot perform the App Store hand-off - so the click
           handler runs too late to matter, if it runs at all. A <button> is
           not a navigation to intercept, so the browser leaves it alone and
           the window.location assignment inside it goes straight through.
           That is exactly what the test proved, and the previous fix failed to
           copy it.

           So on iOS the anchor is replaced with a real button carrying the
           same artwork and the same address. The markup keeps the <a>, which
           is what desktop, no-JS and long-press-to-copy all use. */
        var inAppBrowser = /musical_ly|Bytedance|TikTok|Instagram|FBAN|FBAV|Line\/|Snapchat/i.test(navigator.userAgent || "");
        var url = apple.getAttribute("href");
        var swap = document.createElement("button");
        swap.type = "button";
        swap.className = apple.className;
        swap.setAttribute("aria-label", apple.getAttribute("aria-label") || "Download on the App Store");
        swap.innerHTML = apple.innerHTML;
        apple.parentNode.replaceChild(swap, apple);

        swap.addEventListener("click", function () {
          var left = false;
          var onHide = function () {
            if (document.hidden) left = true;
          };
          document.addEventListener("visibilitychange", onHide);

          /* Inside an in-app browser, x-safari-https:// goes first.

             It is Safari's own scheme and asks iOS to open the address in
             Safari, where the App Store link works perfectly. It is also
             undocumented and depends on the host app passing an unknown scheme
             to iOS at all - which is the exact thing TikTok would not do for
             itms-appss://, so this is a long shot rather than a fix.

             First, though, because it is the only route that ends somewhere
             useful, and because the https address here produces the "action
             cannot be completed" dialog - so anything tried after it arrives
             behind an error the parent is already reading. */
          var attempts = inAppBrowser
            ? ["x-safari-" + url, url, "itms-appss://apps.apple.com/app/id6784545562?ct=download"]
            : [url, "itms-appss://apps.apple.com/app/id6784545562?ct=download"];

          window.location.href = attempts[0];

          attempts.slice(1).forEach(function (next, index) {
            window.setTimeout(function () {
              if (left || document.hidden) return;
              window.location.href = next;
            }, 1100 * (index + 1));
          });

          window.setTimeout(function () {
            document.removeEventListener("visibilitychange", onHide);
            if (left || document.hidden) return;
            var note = document.getElementById("inapp-note");
            if (!note) return;
            note.hidden = false;
            note.scrollIntoView({ block: "center" });
          }, 1100 * attempts.length);
        });

        /* An iPhone inside an in-app browser. Measured, not guessed: the Play
           badge works from TikTok because Android treats a Play link as an
           ordinary URL, while iOS needs a hand-off to the App Store that this
           browser will not perform - the same address opens fine in Safari and
           Chrome on the same phone. Three mechanisms and four attempts went at
           that hand-off before the asymmetry made it plain.

           So these visitors are led to the thing that does work. The web app
           runs in this very browser, which is how they are reading this page,
           and the note below still offers Safari for anyone who wants the app
           now. The badges stay where they are underneath. */
        /* The note is not shown here. It waits for a tap on the App Store
           badge that went nowhere, which the handler above reveals it on -
           telling everybody in advance that a thing will not work is worse
           than letting the ones it affects find out at the moment it matters,
           and the detection is a guess at a user agent either way. */

        var button = document.getElementById("copy-link");
        var link = "https://www.dreamscapes.cloud/download";
        if (!button) return;
        button.addEventListener("click", function () {
          var done = function () {
            button.textContent = "Copied. Now paste it into Safari";
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(done, fallback);
          } else {
            fallback();
          }
          function fallback() {
            // Older in-app webviews have no clipboard API; this one is ancient
            // enough to work in all of them.
            var field = document.createElement("textarea");
            field.value = link;
            field.setAttribute("readonly", "");
            field.style.position = "fixed";
            field.style.opacity = "0";
            document.body.appendChild(field);
            field.select();
            try {
              document.execCommand("copy");
              done();
            } catch (error) {
              button.textContent = link;
            }
            document.body.removeChild(field);
          }
        });
      })();

    </script>
  </body>
</html>
